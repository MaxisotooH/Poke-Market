<!-- registro.html: formulario de registro de un nuevo cliente
     (ruta /usuarios/registro/). Crea un User de Django y su Perfil
     asociado (apodo de entrenador, región favorita). -->

{% extends "shopApp/shop_base.html" %}
<!-- crispy_forms_tags: habilita el filtro |crispy, provisto por el
     package externo django-crispy-forms (ver requirements.txt). -->
{% load crispy_forms_tags %}

{% block title %}Crear cuenta - POKE MARKET{% endblock %}

{% block content %}
    <div class="shop-subtitle">Crear cuenta de entrenador</div>

    <div class="auth-form-wrap">
        <form method="post" class="auth-form">
            <!-- csrf_token: token de seguridad obligatorio en todo POST de Django. -->
            {% csrf_token %}
            <!-- form|crispy renderiza cada campo del RegistroForm (username,
                 email, apodo_entrenador, region_favorita, password1, password2)
                 con las clases de Bootstrap 5 (form-control, mb-3, etc),
                 en vez del HTML plano de form.as_p. -->
            {{ form|crispy }}
            <button type="submit" class="btn-primario">Crear cuenta</button>
        </form>

        <p class="auth-form-link">
            ¿Ya tienes cuenta? <a href="{% url 'usuarios_login' %}">Inicia sesión aquí</a>
        </p>
    </div>
{% endblock %}
