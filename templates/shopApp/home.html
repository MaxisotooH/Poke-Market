<!-- home.html: página de inicio de la tienda (ruta /), renderizada por
     la vista shopApp.views.home. Muestra un botón por cada categoría. -->

{% extends "shopApp/shop_base.html" %}

{% block title %}Poke Market{% endblock %}

{% block content %}
    <div class="shop-categories">
       <!-- El bucle recorre pares (slug, data) ya preparados por la vista.
           Así evitamos chocar con el método .items() del diccionario. -->
       {% for slug, data in categorias %}
            <!-- La etiqueta url genera /<slug>/ usando el
                 name="shop_categoria" definido en shopApp/urls.py, pasándole
                 "slug" como parámetro de la URL. Todos los botones comparten
                 la clase category-btn: mismo ancho/alto (CSS Grid en
                 .shop-categories) y mismo estilo, con el rojo de acento
                 solo al pasar el mouse/enfocar. data.icono es el emoji que
                 identifica visualmente la categoría (ver CATEGORIAS en
                 shopApp/views.py). -->
            <a href="{% url 'shop_categoria' slug %}" class="category-btn">
                <span class="category-btn-icon" aria-hidden="true">{{ data.icono }}</span>
                {{ data.titulo }}
            </a>
        {% endfor %}
    </div>
{% endblock %}
