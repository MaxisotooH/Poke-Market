<!-- shop_base.html: template "padre" propio de la tienda (independiente de
     base.html) porque tiene su propio header con logo, distinto al navbar
     del resto del sitio. Cada página de shopApp extiende de este archivo. -->
<!DOCTYPE html>
{% load static %}
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}POKE MARKET{% endblock %}</title>

        <!-- Bootstrap para los botones, cards y utilidades base. -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- CSS propio de la tienda (colores del header, tarjetas de producto, etc). -->
        <link rel="stylesheet" href="{% static 'shopApp/shop.css' %}">
    </head>
    <body>
        <!-- Cabecera fija de la tienda: logo + título, igual en todas las páginas. -->
        <div class="shop-header">
            <div class="shop-header-brand">
                <img src="{% static 'shopApp/images/shop_logo.png' %}" class="shop-logo" alt="Logo">
                <h1>POKE MARKET</h1>
            </div>

            <!-- request.user está disponible en todos los templates gracias
                 al context processor django.contrib.auth.context_processors.auth
                 (ver TEMPLATES en settings.py). is_authenticated distingue
                 si hay o no una sesión activa. -->
            <div class="shop-header-auth">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'usuarios_perfil' %}" class="shop-header-link">{{ request.user.username }}</a>
                {% else %}
                    <a href="{% url 'usuarios_login' %}" class="shop-header-link">Iniciar sesión</a>
                    <a href="{% url 'usuarios_registro' %}" class="shop-header-link">Registrarse</a>
                {% endif %}
            </div>
        </div>

        <!-- Cada página hija (home.html, categoria.html) inserta aquí su contenido. -->
        {% block content %}{% endblock %}

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
